[package]
name = "evolution"
version = "1.2.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
lto = true

[features]
debug = []

[dependencies]
rand = "*"
rand_chacha = "*"
clap = { version = "4.0", features = ["derive"] }

[[bin]]
name = "evolution"
path = "evolution.rs"
